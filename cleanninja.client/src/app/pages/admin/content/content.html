<c-card class="mb-4">
  <c-card-header><strong>Exclusive Offer Flyer</strong></c-card-header>
  <c-card-body>
    <p class="small text-muted mb-3">Upload a flyer image. Uploading a new image will automatically set it as the active flyer on the public landing page. You can toggle it off in the table below.</p>
    <input cFormControl type="file" accept="image/*" (change)="onFlyerSelected($event)" />
  </c-card-body>
</c-card>

<c-card>
  <c-card-header><strong>Edit Site Content</strong></c-card-header>
  <c-card-body>
    <div class="d-none d-md-block">
      <table cTable hover responsive striped>
      <thead>
        <tr>
          <th>Section</th>
          <th>Key</th>
          <th>Value</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of contentItems">
          <td>{{ item.section }}</td>
          <td><code>{{ item.key }}</code></td>
          <td>
            <textarea cFormControl [(ngModel)]="item.value" rows="2"></textarea>
          </td>
          <td>
            <button cButton color="primary" size="sm" (click)="saveContentItem(item)">
              <svg cIcon name="cilSave"></svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    </div>

    <!-- Mobile Card View -->
    <div class="d-block d-md-none">
      <c-card *ngFor="let item of contentItems" class="mb-3 shadow-sm">
        <c-card-body>
          <div class="mb-2">
            <span class="badge bg-secondary me-2">{{ item.section }}</span>
            <code>{{ item.key }}</code>
          </div>
          <textarea cFormControl [(ngModel)]="item.value" rows="3" class="mb-2"></textarea>
          <button cButton color="primary" class="w-100 d-flex justify-content-center align-items-center" (click)="saveContentItem(item)">
            <svg cIcon name="cilSave" class="me-2"></svg> Save
          </button>
        </c-card-body>
      </c-card>
    </div>

  </c-card-body>
</c-card>
