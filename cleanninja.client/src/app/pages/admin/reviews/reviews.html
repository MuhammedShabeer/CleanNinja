<div class="row fade-in">
  <div class="col-12">
    <div class="card mb-4 shadow-sm border-0">
      <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 text-dark fw-bold">Customer Reviews</h5>
      </div>
      <div class="card-body">
        
        <div *ngIf="loading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div *ngIf="!loading && feedbacks.length === 0" class="text-center py-5 text-muted">
          <p class="mb-0">No customer reviews found.</p>
        </div>

        <div class="table-responsive" *ngIf="!loading && feedbacks.length > 0">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Customer Name</th>
                <th>Service</th>
                <th>Rating</th>
                <th style="max-width: 300px;">Comment</th>
                <th>Date</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let fb of feedbacks">
                <td class="fw-semibold">{{ fb.customerName }}</td>
                <td><span class="badge bg-secondary text-white">{{ fb.serviceName }}</span></td>
                <td>
                  <span class="text-warning">
                    <ng-container *ngFor="let star of [1,2,3,4,5]">
                      <span *ngIf="star <= fb.rating">★</span>
                      <span *ngIf="star > fb.rating" class="text-muted">☆</span>
                    </ng-container>
                  </span>
                  <small class="ms-1 text-muted">({{fb.rating}})</small>
                </td>
                <td class="text-truncate" style="max-width: 300px;" [title]="fb.comment">{{ fb.comment }}</td>
                <td>{{ fb.createdAt | date:'shortDate' }}</td>
                <td>
                  <span class="badge rounded-pill bg-success" *ngIf="fb.isApproved">Approved</span>
                  <span class="badge rounded-pill bg-warning text-dark" *ngIf="!fb.isApproved">Pending</span>
                </td>
                <td class="text-end">
                  <button *ngIf="!fb.isApproved" class="btn btn-sm btn-success text-white me-2" (click)="approveFeedback(fb.id)" title="Approve">
                    <svg cIcon name="cilCheckCircle" size="sm"></svg>
                  </button>
                  <button class="btn btn-sm btn-danger text-white" (click)="deleteFeedback(fb.id)" title="Delete">
                    <svg cIcon name="cilTrash" size="sm"></svg>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>
</div>
