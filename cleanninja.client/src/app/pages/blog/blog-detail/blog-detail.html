<div *ngIf="blog" class="blog-detail-container">
  <div class="container section-padding">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <div class="mb-4">
          <a routerLink="/blogs" class="text-decoration-none text-muted mb-3 d-inline-block">
            <i class="bi bi-arrow-left"></i> Back to Blogs
          </a>
          <h1 class="display-5 fw-bold mb-3">{{ blog.title }}</h1>
          <div class="d-flex align-items-center text-muted">
            <span class="me-4"><i class="bi bi-person me-1"></i> {{ blog.author }}</span>
            <span><i class="bi bi-calendar me-1"></i> {{ blog.createdAt }}</span>
          </div>
        </div>

        <img *ngIf="blog.imageUrl" [src]="blog.imageUrl" class="img-fluid rounded shadow-sm mb-5 w-100" alt="{{ blog.title }}" style="max-height: 500px; object-fit: cover;">
        
        <div class="blog-content fs-5" style="white-space: pre-wrap; line-height: 1.8;" [innerHTML]="blog.content">
        </div>

      </div>
    </div>
  </div>
</div>

<div *ngIf="!blog" class="container text-center section-padding">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>
