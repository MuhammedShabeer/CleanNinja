<div class="landing-theme" *ngIf="showBrandedHeader">
  <header class="app-header">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="logo">
        <a routerLink="/"><img src="assets/images/CleanNinjaNew.png" alt="Clean Ninja"> CLEAN NINJA</a>
      </div>
      <button class="menu-trigger" (click)="toggleMobileMenu()">☰</button>
      <nav class="nav-links" [class.mobile-open]="isMobileMenuOpen">
        <a routerLink="/" (click)="closeMobileMenu()">Home</a>
        <a routerLink="/blogs" (click)="closeMobileMenu()">Blogs</a>
        <a routerLink="/gallery" (click)="closeMobileMenu()">Gallery</a>
        <a href="#contact" (click)="closeMobileMenu()">Contact</a>
        <a routerLink="/booking" class="btn-primary shimmer-effect" (click)="closeMobileMenu()">Book Now</a>
      </nav>
    </div>
  </header>
</div>

<main class="app-main" [class.landing-theme]="showBrandedHeader" [class.admin-theme]="!showBrandedHeader">
  <router-outlet></router-outlet>
</main>

<div class="landing-theme" *ngIf="showBrandedHeader">
  <app-footer></app-footer>
</div>

<!-- PWA Install Banner - Only for landing/booking -->
<div class="landing-theme" *ngIf="showBrandedHeader && showInstallButton">
  <div class="pwa-install-banner">
    <div class="pwa-install-content">
      <img src="assets/images/icon-192x192.png" alt="Clean Ninja" class="pwa-icon">
      <div class="pwa-text">
        <strong>Install Clean Ninja</strong>
        <span>Add to your home screen for the best experience</span>
      </div>
    </div>
    <div class="pwa-actions">
      <button (click)="showInstallButton = false" class="pwa-dismiss">✕</button>
      <button (click)="installPwa()" class="btn-primary pwa-install-btn">Install</button>
    </div>
  </div>
</div>
